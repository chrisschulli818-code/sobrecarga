name: CI
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'   # toda segunda: pega vulnerabilidade nova mesmo sem commit
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Vulnerabilidades em dependências
        run: npm audit --audit-level=moderate

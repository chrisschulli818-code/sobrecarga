databases:
  - name: sobrecarga-db
    plan: free
    databaseName: sobrecarga
    user: sobrecarga

services:
  - type: web
    name: sobrecarga
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sobrecarga-db
          property: connectionString
